[package]
name = "omnisect"
version = "1.0.0"
description = "Omnisect desktop shell"
authors = ["Omnisect"]
edition = "2021"

[lib]
name = "omnisect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
